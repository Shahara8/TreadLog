name: Deploy Blazor PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Blazor WASM
        run: dotnet publish TreadLog.Web/TreadLog.Web.csproj -c Release -o release

      - name: Set production API URL
        run: |
          jq --arg url "${{ secrets.API_BASE_URL }}" '.ApiBaseUrl = $url' \
            release/wwwroot/appsettings.json > tmp.json \
          && mv tmp.json release/wwwroot/appsettings.json

      - name: Fix base href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/TreadLog/" />|g' \
            release/wwwroot/index.html

      - name: Add 404.html for Blazor client-side routing
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
